[project]
name = "wttrman"
version = "2.1.0"
description = "GUI front-end to https://wttr.in/."
readme = "README.md"
license = "MIT"
authors = [{ name = "Melvin Quick", email = "melvinquick@proton.me" }]
requires-python = ">=3.11"
dependencies = ["pyside6>=6.12.0", "pyyaml>=6.0.4", "requests>=2.34.2"]

[project.urls]
repository = "https://github.com/melvinquick/wttrman"
issues = "https://github.com/melvinquick/wttrman/issues"

[project.gui-scripts]
wttrman = "wttrman.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["bandit>=1.9.4"]
